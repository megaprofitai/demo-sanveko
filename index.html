<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sanveko · Savininko valdymo skydelis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0232e8; --blue-d:#0226b4; --blue-l:#3a5cff;
  --blue-soft:#eaeeff; --blue-soft2:#f3f5ff;
  --navy:#0b1440;
  --text:#323232; --muted:#6b7280; --dim:#9aa3b2;
  --bg:#f4f6fb; --card:#ffffff; --line:#e5e9f2; --line2:#eef1f7;
  --green:#0f7a45; --green-bg:#e5f4ec;
  --amber:#9a6510; --amber-bg:#fdf2e0;
  --red:#b3261e; --red-bg:#fdeceb;
  --r:14px;
  --sh:0 1px 2px rgba(16,24,64,.05), 0 6px 20px rgba(16,24,64,.05);
  --sh2:0 20px 60px rgba(11,20,64,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Montserrat',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6dbe8;border-radius:8px;border:3px solid var(--bg)}

.app{display:flex;min-height:100vh}

/* ---------- Šoninis meniu ---------- */
.sidebar{width:264px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line2)}
.brand img{width:148px;display:block}
.brand-sub{font-size:9.5px;font-weight:700;letter-spacing:1.6px;color:var(--dim);margin-top:9px;text-transform:uppercase}
.nav-lab{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--dim);padding:20px 22px 8px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;
  color:#5b6472;font-size:14px;font-weight:500;transition:.14s;text-align:left;width:100%}
.nav-item:hover{background:var(--blue-soft2);color:var(--text)}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(2,50,232,.28)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:#ff5a2d;color:#fff;font-size:10.5px;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav-item.active .nav-badge{background:#fff;color:var(--blue)}
.side-foot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.foot-name{font-size:12.5px;font-weight:600;line-height:1.25}
.foot-sub{font-size:11px;color:var(--dim)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:var(--muted);transition:.14s;background:#fff;flex-shrink:0}
.icon-btn:hover{border-color:var(--blue);color:var(--blue)}
.icon-btn svg{width:17px;height:17px}

/* ---------- Turinys ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:flex-start;gap:16px;padding:26px 34px 18px;position:sticky;top:0;
  background:rgba(244,246,251,.9);backdrop-filter:blur(8px);z-index:30}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.bell{position:relative}
.bell .dot{position:absolute;top:-5px;right:-5px;background:#ff5a2d;color:#fff;font-size:10px;font-weight:700;
  width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.content{padding:0 34px 46px;flex:1}
.burger{display:none}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-size:13.5px;
  font-weight:600;padding:10px 17px;border-radius:10px;transition:.14s;box-shadow:0 4px 14px rgba(2,50,232,.25)}
.btn:hover{background:var(--blue-d)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);background:#fff}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}

/* ---------- Bendri blokai ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.note{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:3px solid #e8a33d;
  border-radius:12px;padding:14px 18px;margin-bottom:20px}
.note b{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px}
.note p{font-size:12.5px;color:var(--muted);line-height:1.5}
.note svg{width:18px;height:18px;color:#e8a33d;flex-shrink:0;margin-top:1px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 19px;box-shadow:var(--sh)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.kpi-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi-ic svg{width:17px;height:17px}
.kpi-num{font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--navy);line-height:1.15}
.kpi-lab{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.p-green{background:var(--green-bg);color:var(--green)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:#f0f2f7;color:#6b7280}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:12px;padding:17px 20px 0}
.sec-lab{font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--blue);text-transform:uppercase}
.sec-head .btn{margin-left:auto}
.sec-title{font-size:20px;font-weight:700;color:var(--navy);padding:2px 20px 0;letter-spacing:-.01em}
.sec-body{padding:14px 20px 20px}

.tabs{display:inline-flex;background:#eef1f7;border-radius:11px;padding:3px;gap:2px;margin-bottom:16px}
.tab{padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.14s}
.tab.active{background:var(--navy);color:#fff}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:11px 15px;margin-bottom:14px;box-shadow:var(--sh)}
.searchbar svg{width:17px;height:17px;color:var(--dim);flex-shrink:0}
.searchbar input{border:none;outline:none;flex:1;background:none;color:var(--text)}
.toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolrow .tabs{margin-bottom:0}
.toolrow .right{margin-left:auto;display:flex;gap:9px}

.row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 17px;margin-bottom:9px;transition:.14s;box-shadow:var(--sh);width:100%;text-align:left}
.row:hover{border-color:#c7d0e8;transform:translateY(-1px)}
.row-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-ic svg{width:18px;height:18px}
.row-main{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.row-num{font-size:14.5px;font-weight:700;color:var(--navy);white-space:nowrap}
.day-lab{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;margin:18px 0 9px}
.day-lab:first-child{margin-top:0}

.bar{height:7px;background:#eef1f7;border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:6px}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px}
.hint{font-size:11.5px;color:var(--dim);margin-top:12px;line-height:1.5}

table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--dim);text-transform:uppercase;
  text-align:left;padding:0 14px 11px;border-bottom:1px solid var(--line2)}
td{padding:14px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--blue-soft2)}
.t-strong{font-weight:600;color:var(--navy)}
.t-mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy);white-space:nowrap}
.tbl-wrap{overflow-x:auto}

/* ---------- Etapai ---------- */
.steps{display:flex;gap:5px;margin-top:11px}
.step{flex:1;height:6px;border-radius:4px;background:#eef1f7}
.step.done{background:var(--blue)}
.step.now{background:var(--blue-l);box-shadow:0 0 0 3px rgba(2,50,232,.14)}
.steplist{display:flex;flex-direction:column;gap:0}
.stepitem{display:flex;gap:13px;padding:9px 0}
.stepdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--dim);background:#fff}
.stepitem.done .stepdot{background:var(--blue);border-color:var(--blue);color:#fff}
.stepitem.now .stepdot{border-color:var(--blue);color:var(--blue)}
.stepitem .st-t{font-size:13.5px;font-weight:500;color:var(--muted)}
.stepitem.done .st-t,.stepitem.now .st-t{color:var(--navy);font-weight:600}
.stepitem .st-d{font-size:11.5px;color:var(--dim)}

/* ---------- Diagrama ---------- */
.chart{width:100%;height:170px;display:block}
.chart-legend{display:flex;gap:18px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}

/* ---------- Modalas ---------- */
.mback{position:fixed;inset:0;background:rgba(11,20,64,.45);backdrop-filter:blur(3px);z-index:90;
  display:none;align-items:center;justify-content:center;padding:22px}
.mback.show{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:var(--sh2);width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto}
.m-head{display:flex;align-items:flex-start;gap:14px;padding:24px 26px 18px;border-bottom:1px solid var(--line2)}
.m-title{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.m-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.m-close{margin-left:auto;width:30px;height:30px;border-radius:9px;background:#f2f4f9;color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-close:hover{background:#e7eaf2}
.m-close svg{width:15px;height:15px}
.m-body{padding:20px 26px 24px}
.drow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.drow:last-of-type{border-bottom:none}
.drow .k{color:var(--muted)}
.drow .v{font-weight:600;color:var(--navy);text-align:right}
.m-acts{display:flex;gap:9px;margin-top:18px}
.m-acts .btn{flex:1;justify-content:center}
.quote{background:var(--blue-soft2);border:1px solid var(--blue-soft);border-radius:12px;padding:14px 16px;
  font-size:13px;color:#3a4256;line-height:1.6;margin-top:14px}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--navy);
  color:#fff;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:120;
  box-shadow:var(--sh2);transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- Adaptyvumas ---------- */
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2b{grid-template-columns:1fr}
}
.big-num{font-size:33px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1}
@media(max-width:560px){
  .big-num{font-size:26px}
  .row{flex-wrap:wrap}
  .row-end{flex-direction:row;width:100%;justify-content:flex-start;align-items:center;gap:9px;margin-top:5px}
  .steps{gap:3px}
}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:var(--sh2)}
  .sidebar.open{transform:translateX(0)}
  .burger{display:flex}
  .topbar{padding:18px 18px 14px;align-items:center}
  .content{padding:0 18px 40px}
  .page-title{font-size:21px}
  .page-sub{display:none}
  .kpis{grid-template-columns:1fr;gap:10px}
  .scrim{position:fixed;inset:0;background:rgba(11,20,64,.4);z-index:35;display:none}
  .scrim.show{display:block}
  .row{padding:13px 14px}
  .modal{max-width:100%}
}
</style>
</head>

/* ---------- Diagrama ---------- */
function chart(){
  var d=D.pajamuIstorija, max=0;
  d.forEach(function(x){ if(x.v>max) max=x.v; });
  max = Math.ceil(max/10000)*10000;
  var W=100, n=d.length, bw=W/n, bars='', labs='';
  d.forEach(function(x,i){
    var h=(x.v/max)*88, y=92-h, last=(i===n-1);
    bars+='<rect x="'+(i*bw+bw*0.24).toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+(bw*0.52).toFixed(2)+'" height="'+h.toFixed(2)+'" '
       + 'fill="'+(last?'#0232e8':'#c9d4ff')+'"/>';
    labs+='<div style="flex:1;text-align:center;font-size:11px;font-weight:600;color:'+(last?'#0b1440':'#9aa3b2')+'">'+x.m+'</div>';

function steps(n){

}
function taskRow(icn,c,bg,t,s,to){

        : u.bus==='Netinka' ? 'p-gray' : 'p-blue';

  return '<button class="row" onclick="openUz(\''+u.id+'\')">'
    + '<div class="row-ic" style="background:'+bg+';color:'+c+'">'+ic(u.sla==='delay'?'alert':'form')+'</div>'
    + '<div class="row-main"><div class="row-t">'+u.v+'</div>'
    + '<div class="row-s">'+u.pasl+' · '+u.gauta+'</div></div>'
    + '<div class="row-end"><span class="pill '+p+'">'+u.bus+'</span>'
    + (u.laukia!=='—' ? '<span style="font-size:11px;color:'+(u.sla==='delay'?'#b3261e':'var(--dim)')+'">laukia '+u.laukia+'</span>' : '')

    + '<div class="m-sub">'+c.v+(s.obj!=='—'?' · '+s.obj:'')+'</div></div>'
    + '<span class="pill '+busPill(s.bus)+'" style="margin-top:4px">'+s.bus+'</span>'
    + '<button class="m-close" onclick="closeModal()">'+ic('x',2.4)+'</button></div>';
  h += '<div class="m-body">'
    + drow('Darbai',eur(s.darbai)) + drow('Medžiagos ir įranga',eur(s.medz))
    + drow('Suma be PVM',eur(s.darbai+s.medz)) + drow('PVM 21 %',eur(pvm))
    + '<div class="drow" style="border-top:2px solid var(--line);margin-top:4px;padding-top:14px">'
    + '<span class="k" style="font-weight:600;color:var(--navy)">Iš viso su PVM</span>'
    + '<span class="v" style="font-size:17px;color:var(--blue)">'+eur(s.darbai+s.medz+pvm)+'</span></div>'
    + drow('Parengta',s.data) + drow('Galioja iki',s.galioja)
    + '<div class="m-acts"><button class="btn" onclick="toast(\'Demo: sąmata nesiunčiama\')">'+ic('send')+'Siųsti klientui</button>'
    + '<button class="btn ghost" onclick="toast(\'Demo: PDF negeneruojamas\')">'+ic('dl')+'PDF</button></div></div>';
  showModal(h);
}

/* ================= 6. SĄSKAITOS ================= */
function cnt(b){ return D.saskaitos.filter(function(s){return s.bus===b}).length; }
function vSaskaitos(){
  var h = NOTE;
  var apm = D.saskaitos.filter(function(s){return s.bus==='Apmokėta'}).reduce(function(a,s){return a+s.suma},0);
  var lauk = D.saskaitos.filter(function(s){return s.bus==='Laukiama'}).reduce(function(a,s){return a+s.suma},0);
  var vel = D.saskaitos.filter(function(s){return s.bus==='Vėluoja'}).reduce(function(a,s){return a+s.suma},0);
  h += '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'
    + kpi('check','#0f7a45','#e5f4ec',eur0(apm),'Apmokėta','<span class="pill p-green">'+cnt('Apmokėta')+' vnt.</span>')
    + kpi('clock','#9a6510','#fdf2e0',eur0(lauk),'Laukiama apmokėjimo','<span class="pill p-amber">'+cnt('Laukiama')+' vnt.</span>')
    + kpi('alert','#b3261e','#fdeceb',eur0(vel),'Vėluoja','<span class="pill p-red">7 d.</span>')
    + '</div>';
  h += '<div class="toolrow">'+tabs([['visi','Visos'],['apm','Apmokėtos'],['lauk','Laukiama'],['vel','Vėluoja']])
    + '<div class="right"><button class="btn ghost sm" onclick="toast(\'Demo: eksportas neaktyvus\')">'+ic('dl')+'CSV</button>'
    + '<button class="btn sm" onclick="toast(\'Demo: sąskaita neišrašoma\')">'+ic('plus')+'Nauja sąskaita</button></div></div>';
  var list = D.saskaitos.filter(function(s){
    return filt==='visi' || (filt==='apm'&&s.bus==='Apmokėta') || (filt==='lauk'&&s.bus==='Laukiama') || (filt==='vel'&&s.bus==='Vėluoja');
  });
  h += '<div class="card"><div class="sec-body" style="padding-top:18px"><div class="tbl-wrap"><table><thead><tr>'
    + '<th>Numeris</th><th>Klientas</th><th>Objektas</th><th>Suma</th><th>Terminas</th><th>Būsena</th>'
    + '</tr></thead><tbody>';
  if(!list.length) h += '<tr><td colspan="6"><div class="empty">Sąskaitų pagal šį filtrą nėra.</div></td></tr>';
  list.forEach(function(s){
    var term = s.bus==='Vėluoja' ? '<span style="color:#b3261e;font-weight:600">'+s.terminas+' · vėluoja '+Math.abs(s.dienos)+' d.</span>'
      : s.bus==='Laukiama' ? s.terminas+' · dar '+s.dienos+' d.' : s.terminas;
    h += '<tr onclick="openSask(\''+s.nr+'\')"><td class="t-strong">'+s.nr+'</td>'
      + '<td>'+kl(s.kl).v+'</td><td style="color:var(--muted)">'+s.obj+'</td>'
      + '<td class="t-mono">'+eur(s.suma)+'</td>'
      + '<td style="color:var(--muted)">'+term+'</td>'
      + '<td><span class="pill '+busPill(s.bus)+'">'+s.bus+'</span></td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}
function openSask(nr){
  var s = D.saskaitos.filter(function(x){return x.nr===nr})[0], c = kl(s.kl);
  var bePVM = Math.round(s.suma/1.21), pvm = s.suma-bePVM;
  var h = '<div class="m-head"><div style="flex:1;min-width:0"><div class="m-title">'+s.nr+'</div>'
    + '<div class="m-sub">'+c.v+'</div></div>'
    + '<span class="pill '+busPill(s.bus)+'" style="margin-top:4px">'+s.bus+'</span>'
    + '<button class="m-close" onclick="closeModal()">'+ic('x',2.4)+'</button></div>';
  h += '<div class="m-body">'
    + drow('Objektas',s.obj) + drow('Suma be PVM',eur(bePVM)) + drow('PVM 21 %',eur(pvm))
    + '<div class="drow" style="border-top:2px solid var(--line);margin-top:4px;padding-top:14px">'
    + '<span class="k" style="font-weight:600;color:var(--navy)">Iš viso</span>'
    + '<span class="v" style="font-size:17px;color:var(--blue)">'+eur(s.suma)+'</span></div>'
    + drow('Apmokėjimo terminas',s.terminas)
    + (s.bus==='Vėluoja' ? '<div class="quote" style="border-color:#f6cfcb;background:#fdeceb;color:#7d1a15">'
        + 'Sąskaita vėluoja '+Math.abs(s.dienos)+' d. Automatinis priminimas klientui išsiųstas '+ '2026-08-31.' + '</div>' : '')
    + '<div class="m-acts"><button class="btn" onclick="toast(\'Demo: priminimas nesiunčiamas\')">'+ic('bell')+'Siųsti priminimą</button>'
    + '<button class="btn ghost" onclick="toast(\'Demo: PDF negeneruojamas\')">'+ic('dl')+'PDF</button></div></div>';
  showModal(h);
}

/* ================= 7. MOKĖJIMAI ================= */
function vMokejimai(){
  var h = NOTE;
  h += '<div class="grid2" style="grid-template-columns:1fr 1fr">'
    + '<div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#e5f4ec;color:#0f7a45">'+ic('euro')+'</div>'
    + '<span class="pill p-green">▲ 7,6 %</span></div>'
    + '<div class="kpi-num" style="font-size:31px;color:#0f7a45">'+eur(D.pajamos)+'</div>'
    + '<div class="kpi-lab">Surinkta '+D.menuo.toLowerCase()+' mėn.</div></div>'
    + '<div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:#fdf2e0;color:#9a6510">'+ic('clock')+'</div>'
    + '<span class="pill p-amber">3 sąskaitos</span></div>'
    + '<div class="kpi-num" style="font-size:31px;color:#9a6510">'+eur(D.neapmoketa)+'</div>'
    + '<div class="kpi-lab">Neapmokėta · iš jų '+eur0(7425)+' vėluoja</div></div></div>';

  h += '<div class="card" style="margin-bottom:16px"><div class="sec-head"><span class="sec-lab">Pajamos pagal mėnesius</span></div>'
    + '<div class="sec-body">'+chart()+'</div></div>';

  h += '<div class="toolrow"><span class="sec-lab" style="color:var(--blue)">MOKĖJIMŲ ISTORIJA</span>'
    + '<div class="right"><button class="btn ghost sm" onclick="toast(\'Demo: eksportas neaktyvus\')">'+ic('dl')+'CSV</button></div></div>';
  h += '<div class="day-lab">Rugpjūtis 2026 · '+eur(D.mokejimai.reduce(function(a,m){return a+m.suma},0))+'</div>';
  D.mokejimai.forEach(function(m){
    h += '<div class="row" style="cursor:default">'
      + '<div class="row-ic" style="background:#e5f4ec;color:#0f7a45">'+ic('check')+'</div>'
      + '<div class="row-main"><div class="row-t">'+kl(m.kl).v+'</div>'
      + '<div class="row-s">'+m.data+' · '+m.nr+' · '+m.bud+'</div></div>'
      + '<div class="row-end"><div class="row-num">'+eur(m.suma)+'</div>'
      + '<span class="pill '+(m.dalis?'p-blue':'p-green')+'">'+(m.dalis?'Dalinis':'Apmokėta')+'</span></div></div>';
  });
  return h;
}

/* ================= 8. APTARNAVIMAS ================= */
function vAptarnavimas(){
  var h = NOTE;
  var pot = D.aptarnavimas.reduce(function(a,x){return a+x.kaina},0);
  h += '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'
    + kpi('wrench','#0232e8','#eaeeff',D.aptarnavimas.length,'Prižiūrimi įrenginiai','<span class="pill p-blue">5 klientai</span>')
    + kpi('clock','#9a6510','#fdf2e0','2','Artėja per 14 d.','<span class="pill p-amber">reikia laiko</span>')
    + kpi('euro','#0f7a45','#e5f4ec',eur0(pot),'Aptarnavimo pajamos / ciklas','<span class="pill p-green">pasikartoja</span>')
    + '</div>';
  h += '<div class="toolrow">'+tabs([['visi','Visi'],['vel','Vėluoja'],['art','Artėja'],['supl','Suplanuota']])
    + '<div class="right"><button class="btn sm" onclick="toast(\'Demo: priminimai nesiunčiami\')">'+ic('bell')+'Siųsti priminimus</button></div></div>';
  var list = D.aptarnavimas.filter(function(x){
    return filt==='visi' || (filt==='vel'&&x.bus==='Vėluoja') || (filt==='art'&&x.bus==='Artėja') || (filt==='supl'&&x.bus==='Suplanuota');
  });
  if(!list.length) return h+'<div class="card"><div class="empty">Įrašų pagal šį filtrą nėra.</div></div>';
  list.forEach(function(x){
    var p = x.bus==='Vėluoja'?'p-red' : x.bus==='Artėja'?'p-amber' : 'p-blue';
    var bg = x.bus==='Vėluoja'?'#fdeceb' : x.bus==='Artėja'?'#fdf2e0' : '#eaeeff';
    var c = x.bus==='Vėluoja'?'#b3261e' : x.bus==='Artėja'?'#9a6510' : '#0232e8';
    h += '<button class="row" onclick="toast(\'Demo: aptarnavimo kortelė\')">'
      + '<div class="row-ic" style="background:'+bg+';color:'+c+'">'+ic('wrench')+'</div>'
      + '<div class="row-main"><div class="row-t">'+x.irenginys+'</div>'
      + '<div class="row-s">'+kl(x.kl).v+' · '+x.obj+'</div>'
      + '<div class="row-s" style="color:var(--dim)">'+x.tipas+' · garantija '+x.garantija+'</div></div>'
      + '<div class="row-end"><span class="pill '+p+'">'+x.bus+'</span>'
      + '<span style="font-size:11.5px;color:var(--dim)">'+x.kada+(x.kaina?' · '+eur0(x.kaina):' · garantinis')+'</span></div></button>';
  });
  h += '<div class="hint">Kiekvienas sumontuotas įrenginys automatiškai sukuria priežiūros grafiką — filtrų keitimai ir patikros grįžta kaip pasikartojančios pajamos, o ne kaip užmirštas darbas.</div>';
  return h;
}

/* ================= 9. ĮVYKIAI ================= */
function vIvykiai(){
  var h = NOTE, last='';
  var mapIc = {form:['form','#0232e8','#eaeeff'],mail:['mail','#0232e8','#eaeeff'],bell:['bell','#9a6510','#fdf2e0'],
    obj:['obj','#0232e8','#eaeeff'],doc:['doc','#0232e8','#eaeeff'],pay:['pay','#0f7a45','#e5f4ec'],wrench:['wrench','#0f7a45','#e5f4ec']};
  D.ivykiai.forEach(function(e){
    if(e.d!==last){ h += '<div class="day-lab">'+e.d+'</div>'; last=e.d; }
    var m = mapIc[e.ik]||mapIc.form;
    h += '<div class="row" style="cursor:default">'
      + '<div class="row-ic" style="background:'+m[2]+';color:'+m[1]+'">'+ic(m[0])+'</div>'
      + '<div class="row-main"><div class="row-t" style="white-space:normal">'+e.x+'</div>'
      + '<div class="row-s">'+e.t+' · '+e.s+'</div></div>'
      + '<span class="pill p-gray">Demo</span></div>';
  });
  h += '<div class="hint">Žurnale matosi kiekvienas automatinis veiksmas — kada gauta užklausa, kada išsiųstas atsakymas, kada priminta dėl sąskaitos.</div>';
  return h;
}

/* ================= Modalas / toast ================= */
function showModal(h){ document.getElementById('modal').innerHTML=h; document.getElementById('mback').classList.add('show'); }
function closeModal(){ document.getElementById('mback').classList.remove('show'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
var tT;
function toast(t){
  var el=document.getElementById('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(tT); tT=setTimeout(function(){ el.classList.remove('show'); },2400);
}

/* ================= Startas ================= */
go('apzvalga');
</script>
